spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    url: jdbc:mysql://localhost:3306/coursedb?useTimezone=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: false